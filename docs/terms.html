<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!--
    GitHub Pages serves static files only, so a redirect has to be a page. This
    one stands in for the redirect rule a server would hold: it sends the
    version-less URL to whichever version is in effect.

    The version-less URL is the one handed out to the outside world and the one
    older builds of the extension and the mobile app still link to, so it must
    keep working across a version bump. All three links below — the refresh, the
    canonical and the one in the body — name the version in effect, and all
    three move together (see README).
  -->
  <meta http-equiv="refresh" content="0; url=./terms/v1.0.html">
  <link rel="canonical" href="./terms/v1.0.html">
  <title>利用規約 - Tapylet</title>
</head>
<body>
  <p><a href="./terms/v1.0.html">利用規約</a></p>
</body>
</html>
