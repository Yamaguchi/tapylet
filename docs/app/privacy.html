<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!--
    GitHub Pages serves static files only, so a redirect has to be a page. This
    one stands in for the redirect rule a server would hold: it sends the
    version-less URL to whichever version is in effect.

    The version-less URL is the one handed out to the outside world — the App
    Store and Google Play listings point at it, and every build of the mobile
    app links to it — so it must keep working across a version bump. All three
    links below — the refresh, the canonical and the one in the body — name the
    version in effect, and all three move together (see README).
  -->
  <meta http-equiv="refresh" content="0; url=./privacy/v1.0.html">
  <link rel="canonical" href="./privacy/v1.0.html">
  <title>プライバシーポリシー - Tapylet モバイルアプリ</title>
</head>
<body>
  <p><a href="./privacy/v1.0.html">プライバシーポリシー</a></p>
</body>
</html>
